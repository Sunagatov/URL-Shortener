name: Build and Test

on:
  push:
    branches:
      - master
      - development

jobs:
  run-tests:
    name: Run backend tests
    # MongoDB 8.0 rejects the kernel currently shipped by ubuntu-latest.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27083:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout the source code from the Github repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        working-directory: backend
        run: ./gradlew clean test
        env:
          JWT_SECRET: ci-only-signing-key-for-isolated-tests-not-production-2026
          MONGODB_URI: mongodb://127.0.0.1:27083
          MONGODB_DATABASE: url_shortener_ci
          URL_SHORTENER_TEST_MONGO_URI: mongodb://127.0.0.1:27083
          SERVER_BASE_URL: http://localhost:8080

  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code from the Github repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

# Production releases are approved and run through Vault's remote_release.py.
# This workflow tests source; it does not deploy to the retired EC2 host.
