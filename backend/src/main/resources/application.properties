# suppress inspection "UnusedProperty" for whole file
spring.config.import=optional:file:.env.local[.properties]

# Application Properties
spring.application.name=${SPRING_APPLICATION_NAME:URL-Shortener}
app.base-url=${SERVER_BASE_URL:http://localhost:8080}
app.urls.expiration.default-days=${APP_URLS_EXPIRATION_DEFAULT_DAYS:365}
app.urls.expiration.max-days=${APP_URLS_EXPIRATION_MAX_DAYS:365}
app.urls.short-code.max-generation-attempts=${APP_URLS_SHORT_CODE_MAX_GENERATION_ATTEMPTS:10}
app.urls.pagination.default-page=${APP_URLS_PAGINATION_DEFAULT_PAGE:0}
app.urls.pagination.default-size=${APP_URLS_PAGINATION_DEFAULT_SIZE:10}
app.urls.pagination.max-size=${APP_URLS_PAGINATION_MAX_SIZE:100}
app.urls.redirect.max-cache-seconds=${APP_URLS_REDIRECT_MAX_CACHE_SECONDS:3600}
server.port=${SERVER_PORT:8080}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3010,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3010}
cors.allowed.origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Rate Limit Configuration
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
rate.limit.bucket-cache.max-size=${RATE_LIMIT_BUCKET_CACHE_MAX_SIZE:100000}
rate.limit.bucket-cache.expire-minutes=${RATE_LIMIT_BUCKET_CACHE_EXPIRE_MINUTES:10}
rate.limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:20}
rate.limit.auth.refill-tokens=${RATE_LIMIT_AUTH_REFILL_TOKENS:20}
rate.limit.auth.refill-minutes=${RATE_LIMIT_AUTH_REFILL_MINUTES:1}
rate.limit.public-create.capacity=${RATE_LIMIT_PUBLIC_CREATE_CAPACITY:30}
rate.limit.public-create.refill-tokens=${RATE_LIMIT_PUBLIC_CREATE_REFILL_TOKENS:30}
rate.limit.public-create.refill-minutes=${RATE_LIMIT_PUBLIC_CREATE_REFILL_MINUTES:1}
rate.limit.public-redirect.capacity=${RATE_LIMIT_PUBLIC_REDIRECT_CAPACITY:240}
rate.limit.public-redirect.refill-tokens=${RATE_LIMIT_PUBLIC_REDIRECT_REFILL_TOKENS:240}
rate.limit.public-redirect.refill-minutes=${RATE_LIMIT_PUBLIC_REDIRECT_REFILL_MINUTES:1}
rate.limit.frontend-logs.capacity=${RATE_LIMIT_FRONTEND_LOGS_CAPACITY:30}
rate.limit.frontend-logs.refill-tokens=${RATE_LIMIT_FRONTEND_LOGS_REFILL_TOKENS:30}
rate.limit.frontend-logs.refill-minutes=${RATE_LIMIT_FRONTEND_LOGS_REFILL_MINUTES:1}
rate.limit.authenticated-api.capacity=${RATE_LIMIT_AUTHENTICATED_API_CAPACITY:120}
rate.limit.authenticated-api.refill-tokens=${RATE_LIMIT_AUTHENTICATED_API_REFILL_TOKENS:120}
rate.limit.authenticated-api.refill-minutes=${RATE_LIMIT_AUTHENTICATED_API_REFILL_MINUTES:1}

# Springdoc Configuration
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/api/v1/api-docs}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:${SWAGGER_ENABLED:true}}
springdoc.show-actuator=${SPRINGDOC_SHOW_ACTUATOR:true}
springdoc.packages-to-scan=${SPRINGDOC_PACKAGES_TO_SCAN:com.zufar.urlshortener}
scalar.enabled=${API_DOCS_ENABLED:${SWAGGER_ENABLED:true}}
scalar.path=${SCALAR_PATH:/api/v1/docs}
scalar.theme=${SCALAR_THEME:bluePlanet}
scalar.layout=${SCALAR_LAYOUT:modern}
scalar.darkMode=${SCALAR_DARK_MODE:false}
scalar.hideSearch=${SCALAR_HIDE_SEARCH:false}
scalar.documentDownloadType=${SCALAR_DOCUMENT_DOWNLOAD_TYPE:both}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.accessTokenExpiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refreshTokenExpiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Cache Configuration
spring.cache.type=${SPRING_CACHE_TYPE:caffeine}
spring.cache.caffeine.spec=maximumSize=${CACHE_MAX_SIZE:10000},expireAfterWrite=${CACHE_EXPIRE_MINUTES:30}m
cache.max.size=${CACHE_MAX_SIZE:10000}
cache.expire.minutes=${CACHE_EXPIRE_MINUTES:30}
cache.names=${CACHE_NAMES:urlMappings}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018}
spring.data.mongodb.database=${MONGODB_DATABASE_NAME:${MONGODB_DATABASE:urlshortener}}
spring.data.mongodb.auto-index-creation=true

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,metrics,prometheus}
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_BASE_PATH:/actuator}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
management.endpoint.prometheus.enabled=${MANAGEMENT_PROMETHEUS_ENABLED:true}
management.metrics.export.prometheus.enabled=${MANAGEMENT_METRICS_PROMETHEUS_ENABLED:true}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.org.mongodb.driver=${LOG_LEVEL_MONGODB:WARN}
logging.level.org.springframework.data.mongodb=${LOG_LEVEL_SPRING_DATA:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:WARN}
logging.level.com.zufar.urlshortener=${LOG_LEVEL_APP:INFO}
logging.level.http.access=${LOG_LEVEL_HTTP_ACCESS:INFO}
logging.level.frontend.logs=${LOG_LEVEL_FRONTEND_LOGS:WARN}
logging.slow-request-threshold-ms=${LOG_SLOW_REQUEST_THRESHOLD_MS:1000}
logging.file.name=${LOG_FILE_NAME:logs/application.log}
logging.frontend.file.name=${LOG_FRONTEND_FILE_NAME:logs/frontend-events.log}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.pattern.console=${LOG_PATTERN_CONSOLE:"%d{yyyy-MM-dd HH:mm:ss.SSS} - correlationId=%X{correlationId} [%thread] %-5level %logger{36} - %msg%n"}
