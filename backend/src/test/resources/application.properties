spring.application.name=URL-Shortener-Test
app.base-url=http://localhost:8080
app.urls.expiration.default-days=365
app.urls.expiration.max-days=365
app.urls.short-code.max-generation-attempts=10
app.urls.pagination.default-page=0
app.urls.pagination.default-size=10
app.urls.pagination.max-size=100
app.urls.redirect.max-cache-seconds=3600
server.port=8080
cors.allowed.origins=http://localhost:3000,http://localhost:3001,http://localhost:3010
rate.limit.enabled=true
rate.limit.trusted-proxies=
rate.limit.bucket-cache.max-size=1000
rate.limit.bucket-cache.expire-minutes=10
rate.limit.auth.capacity=20
rate.limit.auth.refill-tokens=20
rate.limit.auth.refill-minutes=1
rate.limit.public-create.capacity=30
rate.limit.public-create.refill-tokens=30
rate.limit.public-create.refill-minutes=1
rate.limit.public-redirect.capacity=240
rate.limit.public-redirect.refill-tokens=240
rate.limit.public-redirect.refill-minutes=1
rate.limit.frontend-logs.capacity=30
rate.limit.frontend-logs.refill-tokens=30
rate.limit.frontend-logs.refill-minutes=1
rate.limit.authenticated-api.capacity=120
rate.limit.authenticated-api.refill-tokens=120
rate.limit.authenticated-api.refill-minutes=1
turnstile.enabled=false
turnstile.auth-enabled=false
turnstile.url-create-enabled=false
turnstile.secret-key=
turnstile.connect-timeout=PT2S
turnstile.read-timeout=PT3S
jwt.secret=test-secret-key-that-is-long-enough-32-bytes-minimum
jwt.accessTokenExpiration=3600000
jwt.refreshTokenExpiration=604800000
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=1m
cache.max.size=100
cache.expire.minutes=1
cache.names=urlMappings
spring.mongodb.uri=mongodb://localhost:27017
spring.mongodb.database=urlshortener-test
spring.data.mongodb.auto-index-creation=false
logging.level.http.access=WARN
logging.slow-request-threshold-ms=1000
google.oauth.client-id=test-client-id
google.oauth.client-secret=test-client-secret
google.oauth.redirect-uri=http://localhost:3000/callback
