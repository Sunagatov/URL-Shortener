spring.application.name=URL-Shortener-Test
app.base-url=http://localhost:8080
app.urls.expiration.default-days=365
app.urls.expiration.max-days=365
app.urls.short-code.max-generation-attempts=10
app.urls.pagination.default-page=0
app.urls.pagination.default-size=10
app.urls.pagination.max-size=100
app.urls.redirect.max-cache-seconds=3600
server.port=8080
cors.allowed.origins=http://localhost:3000,http://localhost:3001,http://localhost:3010
rate.limit.requests=100
jwt.secret=test-secret-key-that-is-long-enough-32-bytes-minimum
jwt.accessTokenExpiration=3600000
jwt.refreshTokenExpiration=604800000
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=1m
cache.max.size=100
cache.expire.minutes=1
cache.names=urlMappings
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=urlshortener-test
spring.data.mongodb.auto-index-creation=false
logging.level.http.access=INFO
logging.slow-request-threshold-ms=1000
